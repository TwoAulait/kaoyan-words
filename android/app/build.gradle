plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kaoyan.words'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId "com.kaoyan.words"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

// javac 固定 UTF-8，避免中文源码在中文 Windows 上按 GBK 编译出错
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
